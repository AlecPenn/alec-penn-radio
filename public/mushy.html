<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mushy Dimensions</title>
<meta name="description" content="A private sunset listening experience. Fluffy pillows, rainbow softness, open sky, shared headphones, great music.">
<meta property="og:title" content="Mushy Dimensions">
<meta property="og:description" content="A private sunset listening experience. Pillows. Open sky. Shared headphones.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fff6ec; --ink:#3a2340; --rose:#ff9fb8; }
  html,body { margin:0; height:100%; background:#f7b9a4; overflow:hidden; font-family:Nunito,system-ui,sans-serif; color:var(--cream); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .ui { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom)); box-sizing:border-box; }
  .top { text-align:center; transition:opacity 1.2s; }
  .kicker { font-size:11px; letter-spacing:.32em; text-transform:uppercase; opacity:.9; text-shadow:0 1px 8px #6a2f5aaa; }
  h1 { font-family:Fraunces,Georgia,serif; font-weight:300; font-size:clamp(44px,9vw,104px); line-height:.92; margin:.18em 0 .12em; letter-spacing:-.01em; text-shadow:0 2px 24px #8a3a6a88, 0 1px 3px #5a2a4a99; }
  h1 i { font-style:italic; font-weight:300; }
  .tag { font-family:Fraunces,Georgia,serif; font-style:italic; font-weight:300; font-size:clamp(17px,2.4vw,23px); opacity:.95; text-shadow:0 1px 10px #6a2f5acc, 0 0 2px #5a2a4a88; }
  .bottom { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:640px; }
  .chip { background:#ffffff26; border:1px solid #ffffff55; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:999px; padding:7px 14px; font-size:13px; letter-spacing:.04em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; pointer-events:auto; }
  .btn { font:600 13px Nunito,sans-serif; letter-spacing:.08em; text-transform:uppercase; padding:12px 20px; border-radius:999px; border:none; cursor:pointer; text-decoration:none; color:var(--ink); background:var(--cream); box-shadow:0 6px 24px #6a2f5a44; }
  .btn.ghost { background:#ffffff22; color:var(--cream); border:1px solid #ffffff77; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .soon { font-size:11px; letter-spacing:.3em; text-transform:uppercase; opacity:.9; text-shadow:0 1px 8px #3a2340cc; }
  .hint { font-size:11px; opacity:.8; letter-spacing:.12em; text-shadow:0 1px 6px #3a2340cc; transition:opacity .6s; }
  @media (max-width:600px){ .chip{ font-size:12px; padding:6px 11px; } .btn{ padding:11px 16px; font-size:12px; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c" aria-label="A sunset hillside with fluffy pillows, rainbow blankets and shared headphones"></canvas>
<div class="ui">
  <div class="top" id="top">
    <div class="kicker">A private sunset listening experience</div>
    <h1>Mushy <i>Dimensions</i></h1>
    <div class="tag">fluffy pillows · rainbow softness · open sky · great music</div>
  </div>
  <div class="bottom">
    <div class="chips"><span class="chip">☁ Sink into pillows</span><span class="chip">🎧 Shared headphones, one sound</span><span class="chip">🌅 Golden hour, every time</span><span class="chip">🧣 Snuggly-weather season</span></div>
    <div class="soon">Coming soon · invite only</div>
    <div class="row">
      <a class="btn" href="/">Listen while you wait · 111.1</a>
      <button class="btn ghost" id="again">↺ Watch the sunset again</button>
    </div>
    <div class="hint" id="hint">drag to look around</div>
  </div>
</div>
<script type="module">
import * as THREE from "three";

const canvas = document.getElementById("c");
const mobile = matchMedia("(max-width: 700px)").matches || matchMedia("(pointer: coarse)").matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.6 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = !mobile; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);

// ── sky: a soft gradient with a low sun; it sinks over ~70 seconds and the stars come out ──
const skyU = { uSun: { value: new THREE.Vector3() }, uT: { value: 0 }, uTime: { value: 0 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: `
    varying vec3 vD; uniform vec3 uSun; uniform float uT; uniform float uTime;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float y = vD.y;
      vec3 top0 = vec3(0.47,0.62,0.93), mid0 = vec3(1.0,0.72,0.66), low0 = vec3(1.0,0.83,0.55);
      vec3 top1 = vec3(0.16,0.13,0.36), mid1 = vec3(0.86,0.42,0.62), low1 = vec3(1.0,0.55,0.38);
      vec3 top2 = vec3(0.04,0.04,0.14), mid2 = vec3(0.28,0.16,0.38), low2 = vec3(0.68,0.32,0.36);
      float a = clamp(uT*2.,0.,1.), b = clamp(uT*2.-1.,0.,1.);
      vec3 top = mix(mix(top0,top1,a),top2,b), mid = mix(mix(mid0,mid1,a),mid2,b), low = mix(mix(low0,low1,a),low2,b);
      vec3 col = mix(low, mid, smoothstep(-0.05, 0.18, y));
      col = mix(col, top, smoothstep(0.15, 0.75, y));
      float d = max(dot(vD, normalize(uSun)), 0.);
      col += vec3(1.0,0.62,0.42) * pow(d, 9.) * (0.55 - 0.25*b);      // warm glow around the sun
      col += vec3(1.0,0.86,0.66) * smoothstep(0.9993, 0.9997, d) * (1. - b*0.6);  // the disc
      // pastel rainbow band, very soft, low in the sky opposite the sun
      float r = smoothstep(0.0, 0.5, y) * (1. - smoothstep(0.4, 0.9, y)) * smoothstep(0.2, -0.6, dot(vD.xz, normalize(uSun.xz)));
      vec3 rb = 0.5 + 0.5*cos(6.2831*(vec3(0.0,0.33,0.67) + y*1.6 + uTime*0.01));
      col = mix(col, col + rb*0.22, r * (0.6 - 0.4*b));
      // stars
      vec2 g = floor(vD.xz/(vD.y+0.25)*130.);
      float s = step(0.996, h(g)) * smoothstep(0.1, 0.5, y) * b * (0.6 + 0.4*sin(uTime*2. + h(g)*30.));
      col += vec3(s);
      gl_FragColor = vec4(col, 1.);
    }`,
}));
scene.add(sky);
scene.fog = new THREE.Fog(0xffc3a8, 18, 120);

// ── light ──
const sun = new THREE.DirectionalLight(0xffb48a, 2.6); sun.castShadow = !mobile;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 80 }); sun.shadow.bias = -0.0004; sun.shadow.radius = 6;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xffd6e6, 0x5a6a3a, 1.0); scene.add(hemi);
const fill = new THREE.DirectionalLight(0xffd2dc, 1.3); scene.add(fill, fill.target);   // soft light on the faces of the pillows
const glowLight = new THREE.PointLight(0xffc27a, 0, 9, 1.6); glowLight.position.set(0, 1.4, 0); scene.add(glowLight);

// ── the hill ──
const hillGeo = new THREE.PlaneGeometry(160, 160, mobile ? 120 : 200, mobile ? 120 : 200); hillGeo.rotateX(-Math.PI / 2);
const height = (x, z) => 2.2 * Math.exp(-(x * x + z * z) / 260) - 0.6 + Math.sin(x * 0.09) * 0.7 + Math.cos(z * 0.07 + 1) * 0.9 - Math.max(0, -z - 30) * 0.12 + 0.18 * Math.sin(x * 0.4 + z * 0.3);
const hp = hillGeo.attributes.position;
for (let i = 0; i < hp.count; i++) hp.setY(i, height(hp.getX(i), hp.getZ(i)));
hillGeo.computeVertexNormals();
const hill = new THREE.Mesh(hillGeo, new THREE.MeshStandardMaterial({ color: 0x9aae5e, roughness: 0.95 })); hill.receiveShadow = true; scene.add(hill);
const H0 = height(0, 0);

// grass: soft blades that sway
const blade = new THREE.ConeGeometry(0.022, 0.3, 3, 1, true); blade.translate(0, 0.15, 0);
const GN = mobile ? 5000 : 14000;
const grassMat = new THREE.MeshStandardMaterial({ color: 0xb4c870, roughness: 0.9, side: THREE.DoubleSide });
const gU = { uTime: { value: 0 } };
grassMat.onBeforeCompile = (sh) => { sh.uniforms.uTime = gU.uTime;
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nuniform float uTime;")
    .replace("#include <begin_vertex>", "#include <begin_vertex>\nvec4 wp = instanceMatrix * vec4(0.,0.,0.,1.);\nfloat k = position.y * position.y * 3.;\ntransformed.x += sin(uTime*1.3 + wp.x*0.6 + wp.z*0.4) * 0.09 * k; transformed.z += cos(uTime*1.1 + wp.z*0.5) * 0.05 * k;"); };
const grass = new THREE.InstancedMesh(blade, grassMat, GN);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color();
for (let i = 0; i < GN; i++) {
  const r = Math.sqrt(Math.random()) * 26, a = Math.random() * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.hypot(x, z) < 3.3) { i--; continue; }
  e.set((Math.random() - 0.5) * 0.4, Math.random() * 6, (Math.random() - 0.5) * 0.4); q.setFromEuler(e);
  const s = 0.5 + Math.random() * 0.7;
  m4.compose(new THREE.Vector3(x, height(x, z) - 0.02, z), q, new THREE.Vector3(s, s * (0.7 + Math.random() * 0.8), s)); grass.setMatrixAt(i, m4);
  grass.setColorAt(i, col.setHSL(0.18 + Math.random() * 0.08, 0.45, 0.55 + Math.random() * 0.2));
}
scene.add(grass);

// wildflowers in pastel colours
const fl = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.06, 0), new THREE.MeshStandardMaterial({ roughness: 0.6 }), mobile ? 500 : 1400);
for (let i = 0; i < fl.count; i++) {
  const r = 3.6 + Math.random() * 20, a = Math.random() * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r;
  m4.compose(new THREE.Vector3(x, height(x, z) + 0.16 + Math.random() * 0.08, z), q.identity(), new THREE.Vector3(0.8, 0.6, 0.8)); fl.setMatrixAt(i, m4);
  fl.setColorAt(i, col.setHSL([0.95, 0.12, 0.6, 0.78, 0.0][i % 5], 0.75, 0.82));
}
scene.add(fl);

// ── the nest: a ring of rainbow blankets and big fluffy pillows ──
const nest = new THREE.Group(); nest.position.y = H0; scene.add(nest);
function rainbowTex(seed) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512; const g = c.getContext("2d");
  const pal = ["#ffb3c7", "#ffd1a8", "#fff1a8", "#c8f0b8", "#b8e2ff", "#d8c4ff"];
  for (let i = 0; i < 12; i++) { g.fillStyle = pal[(i + seed) % pal.length]; g.fillRect(0, i * 512 / 12, 512, 512 / 12 + 1); }
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }   // fuzzy
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const blanketGeo = new THREE.PlaneGeometry(3.4, 2.4, 40, 30); blanketGeo.rotateX(-Math.PI / 2);
{ const p = blanketGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, 0.03 + 0.05 * Math.sin(x * 3.1 + z * 1.7) * Math.cos(z * 2.3) + 0.04 * Math.max(0, Math.abs(x) - 1.4) ); } blanketGeo.computeVertexNormals(); }
for (let i = 0; i < 4; i++) {
  const b = new THREE.Mesh(blanketGeo, new THREE.MeshStandardMaterial({ map: rainbowTex(i), roughness: 1, sheen: 1 }));
  b.rotation.y = i * Math.PI / 2 + 0.3; b.position.set(Math.cos(i * Math.PI / 2 + 0.3) * 1.25, i * 0.004, Math.sin(i * Math.PI / 2 + 0.3) * 1.25);
  b.receiveShadow = true; nest.add(b);
}
// pillow: a softened box with puffed middle and pinched seams
function pillowGeo(w, h, d) {
  const g = new THREE.SphereGeometry(1, 64, 40), p = g.attributes.position;
  const sq = (v) => Math.sign(v) * Math.pow(Math.abs(v), 0.42);              // push the round outline toward a soft square
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const X = sq(x), Z = sq(z), rim = Math.max(Math.abs(X), Math.abs(Z));
    const Y = y * (1 - 0.55 * Math.pow(rim, 6));                              // plump middle, thinner seams
    p.setXYZ(i, X * w / 2, Y * h / 2, Z * d / 2);
  }
  g.computeVertexNormals(); return g;
}
const pillowMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xfff0f4, emissiveIntensity: 0.16, roughness: 0.95, sheen: 1, sheenColor: new THREE.Color(0xffe6f0), sheenRoughness: 0.6 });
const tintMats = [0xffe2ec, 0xfff2d6, 0xe4f6ff, 0xeee4ff].map((c) => new THREE.MeshPhysicalMaterial({ color: c, emissive: c, emissiveIntensity: 0.12, roughness: 0.95, sheen: 1, sheenColor: new THREE.Color(0xffffff), sheenRoughness: 0.5 }));
const pGeo = pillowGeo(1.25, 0.5, 0.9), pGeoS = pillowGeo(0.8, 0.36, 0.6);
const seats = [];
const SEATS = 6;
for (let i = 0; i < SEATS; i++) {
  const a = (i / SEATS) * Math.PI * 2 + 0.2, r = 1.9;
  const p = new THREE.Mesh(pGeo, pillowMat); p.position.set(Math.cos(a) * r, 0.25, Math.sin(a) * r); p.rotation.y = -a + Math.PI / 2; p.rotation.z = 0.04 * Math.sin(i * 3);
  p.castShadow = p.receiveShadow = true; nest.add(p);
  const back = new THREE.Mesh(pGeoS, tintMats[i % 4]); back.position.set(Math.cos(a) * (r + 0.55), 0.42, Math.sin(a) * (r + 0.55)); back.rotation.set(-0.0, -a + Math.PI / 2, 0); back.rotateX(1.05);
  back.castShadow = true; nest.add(back);
  seats.push({ a, r, p });
}
// a few extra scattered pillows
for (let i = 0; i < 5; i++) {
  const a = Math.random() * Math.PI * 2, r = 0.5 + Math.random() * 0.9;
  const p = new THREE.Mesh(pGeoS, i % 2 ? pillowMat : tintMats[(i + 1) % 4]); p.position.set(Math.cos(a) * r, 0.17, Math.sin(a) * r); p.rotation.y = Math.random() * 6; p.castShadow = p.receiveShadow = true; nest.add(p);
}

// shared headphones on each seat, wired to a little glowing hub in the middle
const hpMat = new THREE.MeshStandardMaterial({ color: 0xfff3f6, roughness: 0.4, metalness: 0.1 });
const padMat = new THREE.MeshStandardMaterial({ color: 0xffc9d9, roughness: 0.9 });
const hubMat = new THREE.MeshStandardMaterial({ color: 0xfff1d6, emissive: 0xffb36b, emissiveIntensity: 0.6, roughness: 0.3 });
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.2, 40), hubMat); hub.position.y = 0.12; hub.castShadow = true; nest.add(hub);
const hubTop = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.02, 12, 48), new THREE.MeshStandardMaterial({ color: 0xffd27a, emissive: 0xffa04a, emissiveIntensity: 1.2 })); hubTop.rotation.x = Math.PI / 2; hubTop.position.y = 0.23; nest.add(hubTop);
const cableMat = new THREE.MeshStandardMaterial({ color: 0xfbe6ee, roughness: 0.6 });
const phones = [];
for (const s of seats) {
  const g = new THREE.Group();
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.022, 10, 32, Math.PI), hpMat); g.add(band);
  for (const sx of [-1, 1]) {
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.06, 24), hpMat); cup.rotation.z = Math.PI / 2; cup.position.set(sx * 0.16, -0.02, 0); g.add(cup);
    const pad = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.022, 10, 24), padMat); pad.rotation.y = Math.PI / 2; pad.position.set(sx * 0.13, -0.02, 0); g.add(pad);
  }
  const pos = s.p.position.clone(); pos.y = 0.62; g.position.copy(pos); g.rotation.set(-0.9, -s.a + Math.PI / 2, 0); g.traverse((o) => o.castShadow = true); nest.add(g); phones.push(g);
  // cable: lazy curve from the cup down to the blanket and over to the hub
  const start = pos.clone().add(new THREE.Vector3(Math.cos(s.a) * -0.12, -0.12, Math.sin(s.a) * -0.12));
  const pts = [start, new THREE.Vector3(Math.cos(s.a) * 1.2, 0.08, Math.sin(s.a) * 1.2), new THREE.Vector3(Math.cos(s.a + 0.3) * 0.6, 0.05, Math.sin(s.a + 0.3) * 0.6), new THREE.Vector3(Math.cos(s.a) * 0.24, 0.1, Math.sin(s.a) * 0.24)];
  const cab = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.012, 6), cableMat); nest.add(cab);
}

// string lights on two shepherd poles
const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0 }), bulbs = [];
const poleMat = new THREE.MeshStandardMaterial({ color: 0x6b4a3a, roughness: 0.8 });
const poleA = new THREE.Vector3(-3.2, 0, -2.4), poleB = new THREE.Vector3(3.4, 0, -2.0);
for (const p of [poleA, poleB]) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 2.6, 10), poleMat); m.position.set(p.x, 1.3, p.z); m.castShadow = true; nest.add(m); }
const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(poleA.x, 2.55, poleA.z), new THREE.Vector3(0, 1.75, -2.6), new THREE.Vector3(poleB.x, 2.55, poleB.z));
nest.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 60, 0.008, 5), new THREE.MeshBasicMaterial({ color: 0x3a2a2a })));
for (let i = 1; i < 16; i++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 8), bulbMat.clone()); b.position.copy(curve.getPoint(i / 16)).add(new THREE.Vector3(0, -0.06, 0)); nest.add(b); bulbs.push(b); }

// floating soft orbs (rainbow bokeh) and fireflies
function dot() { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.35, "rgba(255,255,255,.45)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
const dotTex = dot();
const orbs = [];
for (let i = 0; i < (mobile ? 18 : 30); i++) {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: new THREE.Color().setHSL(i / 12 % 1, 0.9, 0.82), transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  m.userData = { a: Math.random() * 6.28, r: 2.8 + Math.random() * 6, y: 0.5 + Math.random() * 2.2, s: 0.25 + Math.random() * 0.5, v: 0.03 + Math.random() * 0.06 };
  scene.add(m); orbs.push(m);
}
const FF = mobile ? 40 : 90, ffGeo = new THREE.BufferGeometry(), ffPos = new Float32Array(FF * 3), ffSeed = [];
for (let i = 0; i < FF; i++) ffSeed.push([Math.random() * 6.28, 3 + Math.random() * 10, 0.3 + Math.random() * 1.6, Math.random() * 10]);
ffGeo.setAttribute("position", new THREE.BufferAttribute(ffPos, 3));
const ff = new THREE.Points(ffGeo, new THREE.PointsMaterial({ map: dotTex, color: 0xfff1a0, size: 0.16, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })); scene.add(ff);

// distant soft clouds
const clouds = [];
for (let i = 0; i < 9; i++) {
  const c = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: 0xffe0e8, transparent: true, opacity: 0.5, depthWrite: false, fog: false }));
  const a = -0.9 + Math.random() * 1.8; c.position.set(Math.sin(a) * 120, 14 + Math.random() * 18, -Math.cos(a) * 120); c.scale.set(40 + Math.random() * 40, 9 + Math.random() * 7, 1);
  c.userData.v = 0.4 + Math.random() * 0.6; scene.add(c); clouds.push(c);
}

// ── camera: slow drift around the nest; drag to look ──
let yaw = 0.35, pitch = 0, dragging = false, px = 0, py = 0, vy = 0, userYaw = 0, userPitch = 0;
canvas.addEventListener("pointerdown", (e) => { dragging = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); document.getElementById("hint").style.opacity = 0; });
canvas.addEventListener("pointermove", (e) => { if (!dragging) return; userYaw += (e.clientX - px) * -0.005; userPitch = Math.max(-0.25, Math.min(0.35, userPitch + (e.clientY - py) * 0.003)); px = e.clientX; py = e.clientY; });
const up = () => { dragging = false; }; canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 60 : 42; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let t0 = performance.now(), last = t0;
document.getElementById("again").onclick = () => { t0 = performance.now(); };
const SUNSET = 70;   // seconds from golden hour to dusk
const sunDir = new THREE.Vector3(), fogA = new THREE.Color(0xffc3a8), fogB = new THREE.Color(0xd77a8a), fogC = new THREE.Color(0x2c2140);
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const T = (now - t0) / 1000, time = now / 1000;
  const k = Math.min(1, T / SUNSET), ks = k * k * (3 - 2 * k);
  // the sun sinks toward the horizon, behind and to the side of the nest
  const el = 0.2 - ks * 0.3, az = -0.35;
  sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();
  skyU.uSun.value.copy(sunDir); skyU.uT.value = ks; skyU.uTime.value = time;
  sun.position.copy(sunDir).multiplyScalar(40).add(new THREE.Vector3(0, H0, 0)); sun.target.position.set(0, H0, 0);
  sun.intensity = 2.8 * Math.max(0, 1 - ks * 1.25); sun.color.setHSL(0.06 - ks * 0.04, 1, 0.72 - ks * 0.12);
  hemi.intensity = 1.0 - ks * 0.62; fill.intensity = 1.4 * (1 - ks * 0.75); fill.position.copy(camera.position).add(new THREE.Vector3(0, 3, 0)); fill.target.position.set(0, H0, 0); hemi.color.setHSL(0.92 - ks * 0.12, 0.6, 0.85 - ks * 0.3);
  scene.fog.color.copy(fogA).lerp(fogB, Math.min(1, ks * 2)).lerp(fogC, Math.max(0, ks * 2 - 1));
  renderer.toneMappingExposure = 1.05 - ks * 0.15;
  const dusk = Math.max(0, (ks - 0.45) / 0.55);
  glowLight.intensity = dusk * 6; hubMat.emissiveIntensity = 0.6 + dusk * 1.8;
  bulbs.forEach((b, i) => b.material.color.setHSL(0.1, 1, 0.55 + dusk * 0.3 + 0.06 * Math.sin(time * 2 + i)));
  grassMat.color.setHSL(0.2, 0.42 - ks * 0.12, 0.62 - ks * 0.25);
  gU.uTime.value = time;
  // orbs drift; fireflies come out at dusk
  for (const o of orbs) { const u = o.userData; u.a += u.v * dt; o.position.set(Math.cos(u.a) * u.r, H0 + u.y + Math.sin(time * 0.5 + u.r) * 0.3, Math.sin(u.a) * u.r); o.scale.setScalar(u.s); o.material.opacity = 0.08 + 0.14 * Math.sin(time * 0.7 + u.r) ** 2; }
  for (let i = 0; i < FF; i++) { const [a, r, y, p] = ffSeed[i]; const aa = a + time * 0.05 + Math.sin(time * 0.3 + p) * 0.4, rr = r + Math.sin(time * 0.4 + p) * 0.6; ffPos[i * 3] = Math.cos(aa) * rr; ffPos[i * 3 + 1] = height(Math.cos(aa) * rr, Math.sin(aa) * rr) + y + Math.sin(time * 0.9 + p) * 0.2; ffPos[i * 3 + 2] = Math.sin(aa) * rr; }
  ffGeo.attributes.position.needsUpdate = true; ff.material.opacity = dusk * (0.75 + 0.25 * Math.sin(time * 3));
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 140) c.position.x = -140; c.material.color.setHSL(0.95 - ks * 0.12, 0.7, 0.88 - ks * 0.45); c.material.opacity = 0.5 - ks * 0.2; }
  phones.forEach((p, i) => p.position.y = 0.62 + Math.sin(time * 1.4 + i) * 0.012);   // the music is gently playing
  hubTop.scale.setScalar(1 + Math.sin(time * 4.2) * 0.04);
  // camera
  if (!dragging) userYaw *= 0.995;
  yaw += dt * 0.025; const Y = yaw + userYaw, R = innerWidth / innerHeight < 0.8 ? 7.6 : 6.0;
  camera.position.set(Math.sin(Y) * R, H0 + (innerWidth / innerHeight < 0.8 ? 2.5 : 2.15) + userPitch * 4, Math.cos(Y) * R);
  camera.lookAt(0, H0 - (innerWidth / innerHeight < 0.8 ? 0.9 : -0.25) + userPitch * 2, 0);
  document.getElementById("top").style.opacity = String(1 - dusk * 0.25);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
